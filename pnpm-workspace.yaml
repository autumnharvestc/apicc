packages:
  - "packages/*"
  - "apps/*"
# better-sqlite3 v13 的 npm 包自带全平台预编译绑定（prebuilds/，运行时经 node-gyp-build 加载），
# 其 install 脚本（prebuild-install）对本机 Node ABI 会 404 并回退 gyp 编译——无需执行，显式忽略。
allowBuilds:
  better-sqlite3: false
  # core-js 的 install 脚本仅打印捐赠提示（antd 依赖链带入），无需执行。
  core-js: false
  # electron 的 postinstall（install.js）负责下载平台运行时二进制。⚠️ pnpm 11.21 实测：
  # allowBuilds 在此仅作「忽略登记」语义（false 项消除 ERR_PNPM_IGNORED_BUILDS 硬错误，
  # 2026-09-03 起首跑 CI 曾依赖它保证 install 退出码为 0），但 true 不会真正放行构建——
  # Electron 二进制由 CI package-smoke 的显式 install.js 步骤与本地手动执行补齐。
  electron: true
  # electron-builder 依赖链带入的 Squirrel 安装器工具，--dir 目标用不到其 install 脚本，显式忽略。
  electron-winstaller: false
  # vue-demi（@vue-flow/core 依赖链带入）的 postinstall 仅做 Vue2/3 垫片切换，
  # 包内默认产物即 Vue 3（isVue3=true），本项目 Vue 3 下无需执行，显式忽略。
  vue-demi: false
