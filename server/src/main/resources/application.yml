# apicc 在线协作服务端配置（规格 m3 §3.5）
spring:
  application:
    name: apicc-server
  datasource:
    # 元数据 H2 文件库，相对运行目录（裁定④）；测试覆写为 jdbc:h2:mem:
    url: jdbc:h2:file:./server-data/metadata
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # 每次启动执行 schema.sql（幂等 DDL：CREATE TABLE IF NOT EXISTS）
      mode: always
  jackson:
    serialization:
      # 时间戳统一 ISO-8601 UTC 文本（裁定 B：Instant → "2026-10-04T08:00:00Z" 形态，契约测试钉住）
      write-dates-as-timestamps: false
  threads:
    virtual:
      # 规格 m3 §2 D2：MVC 开虚拟线程
      enabled: true

server:
  port: 8080

apicc:
  server:
    # 管理后台静态产物目录（规格 m4 §2 D2：默认与运行目录同级；pnpm -C apps/admin-web build 的 dist 内容放入此处）
    console-dir: ./console
    # 注册默认关闭（部署线 D5）：首个账号走启动引导（AdminBootstrap），批量拉人时用环境变量临时开启
    allow-registration: false
    # 首个管理员启动引导（部署线 D6）：users 空表时按以下凭据建号；口令未设则随机生成并 WARN 打印日志（仅一次）
    # 容器环境变量（下划线形态）：APICC_SERVER_ADMIN_USERNAME / APICC_SERVER_ADMIN_PASSWORD
    admin-username: ""
    admin-password: ""
    token-ttl-days: 30
  # 实体 id 生成策略（2026-09-09 BIGINT 化口径 2 的扩展点）：默认 identity=数据库 IDENTITY 自增，
  # 本项仅接受 identity（配置其他值启动即失败，且仅在走默认实现时校验）；外部策略（如雪花）不走此开关——
  # 定义自定义 IdGeneration Bean 即覆盖默认实现，无需 @Primary（DDL 为 GENERATED BY DEFAULT AS IDENTITY，两形态共存）。
  id-generation: identity
