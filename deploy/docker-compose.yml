# apicc 服务端单机部署（部署线 D3：本地构建镜像，不推远端仓库）
# 用法（仓库根执行）：
#   cp deploy/.env.example deploy/.env   # 改好管理员口令
#   docker compose -f deploy/docker-compose.yml up -d --build
# 数据全部落在命名卷 apicc-data（H2 元数据 + 工作区内容 + 管理后台由镜像内置）；
# 健康检查来自镜像 HEALTHCHECK（GET /api/v1/ping）。
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: apicc-server:local
    container_name: apicc-server
    ports:
      - "${APICC_SERVER_BIND_ADDRESS:-0.0.0.0}:${APICC_SERVER_PORT:-8080}:8080"
    volumes:
      - apicc-data:/data
    # .env 不存在时 compose 仍可启动（引导器走随机口令，docker logs 取初始密码）
    env_file:
      - path: ${APICC_SERVER_ENV_FILE:-.env}
        required: false
    restart: unless-stopped

  # opt-in: use docker-compose.collaboration.yml as documented; RPC has no host ports.
  collaboration:
    profiles: [collaboration]
    build:
      context: ..
      dockerfile: Dockerfile.collaboration
    image: apicc-collaboration:local
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "${APICC_COLLABORATION_CPU_VCPU:-1}"
    mem_limit: "${APICC_COLLABORATION_MEMORY_BYTES:-805306368}"
    environment:
      APICC_COLLABORATION_RUNTIME_HEAP_BYTES: "${APICC_COLLABORATION_HEAP_BYTES:-402653184}"
      APICC_COLLABORATION_RUNTIME_CACHE_BYTES: "${APICC_COLLABORATION_CACHE_BYTES:-67108864}"
      APICC_COLLABORATION_RUNTIME_MAX_WIRE_BYTES: "${APICC_COLLABORATION_MAX_WIRE_BYTES:-33554432}"
    secrets:
      - source: collaboration-rpc
        target: collaboration-rpc
    networks: [collaboration-private]
    restart: unless-stopped

secrets:
  collaboration-rpc:
    file: "${APICC_COLLABORATION_SECRET_FILE:-./secrets/collaboration-rpc}"

networks:
  collaboration-private:
    internal: true

volumes:
  apicc-data:
