# 管理员凭据（部署线 D6）：仅在 users 表为空的首启生效。部署前改掉 stringData 占位，
# 或改用 kubectl create secret 导入（避免明文入库版本管理）。
apiVersion: v1
kind: Secret
metadata:
  name: apicc-server-admin
  labels:
    app: apicc-server
type: Opaque
stringData:
  APICC_SERVER_ADMIN_USERNAME: admin
  APICC_SERVER_ADMIN_PASSWORD: change-me-please
