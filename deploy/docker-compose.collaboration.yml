# Explicit optional overlay; the default Java-only command remains unchanged.
services:
  collaboration:
    environment:
      APICC_COLLABORATION_RUNTIME_IN_FLIGHT_BYTES: "${APICC_COLLABORATION_IN_FLIGHT_BYTES:?Set existing inFlightBytes explicitly}"
      APICC_COLLABORATION_RUNTIME_HEADROOM_BYTES: "${APICC_COLLABORATION_HEADROOM_BYTES:?Set existing headroomBytes explicitly}"
      APICC_COLLABORATION_RUNTIME_TOTAL_MEMORY_BYTES: "${APICC_COLLABORATION_MEMORY_BYTES:-805306368}"
  server:
    environment:
      APICC_COLLABORATION_RUNTIME_ENABLED: "true"
      APICC_COLLABORATION_RUNTIME_BASE_URL: http://collaboration:3210
      APICC_COLLABORATION_RUNTIME_SECRET_FILE: /run/secrets/collaboration-rpc
      APICC_COLLABORATION_RUNTIME_MAX_WIRE_BYTES: "${APICC_COLLABORATION_MAX_WIRE_BYTES:-33554432}"
      APICC_COLLABORATION_POLICY_DEPLOYMENT_NODECACHEBYTES: "${APICC_COLLABORATION_CACHE_BYTES:-67108864}"
      APICC_COLLABORATION_POLICY_RESOURCES_CPUVCPU: "${APICC_COLLABORATION_CPU_VCPU:-1}"
      APICC_COLLABORATION_POLICY_RESOURCES_TOTALMEMORYBYTES: "${APICC_COLLABORATION_MEMORY_BYTES:-805306368}"
      APICC_COLLABORATION_POLICY_RESOURCES_NODEHEAPBYTES: "${APICC_COLLABORATION_HEAP_BYTES:-402653184}"
      APICC_COLLABORATION_POLICY_RESOURCES_INFLIGHTBYTES: "${APICC_COLLABORATION_IN_FLIGHT_BYTES:?Set existing inFlightBytes explicitly}"
      APICC_COLLABORATION_POLICY_RESOURCES_HEADROOMBYTES: "${APICC_COLLABORATION_HEADROOM_BYTES:?Set existing headroomBytes explicitly}"
    secrets:
      - source: collaboration-rpc
        target: collaboration-rpc
    networks: [default, collaboration-private]
    depends_on:
      collaboration:
        condition: service_started
