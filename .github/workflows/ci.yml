name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: SDK 与各包 build + test
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      APICC_STRESS_DIAGNOSTICS_DIR: ${{ github.workspace }}/local/ci-stress-diagnostics
    steps:
      - uses: actions/checkout@v5 # v5
      - uses: pnpm/action-setup@v4 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - uses: actions/cache@v4 # v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('server/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - name: Linux 构建、类型与包测试
        run: node scripts/ci-stage.mjs linux-test
      - name: 归档失败压测的合成诊断
        if: failure()
        uses: actions/upload-artifact@v4 # v4
        with:
          name: ci-stress-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local/ci-stress-diagnostics/normal-eight-*/summary.json
            local/ci-stress-diagnostics/normal-eight-*/diagnostics.json
            local/ci-stress-diagnostics/normal-eight-*/capture.json
            local/f7f-acceptance/composition-*/facts.json
            local/f7f-acceptance/composition-*/cleanup.json
            local/f7f-acceptance/composition-*/result.json
          retention-days: 7
          if-no-files-found: warn

  server-test:
    name: 服务端测试
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5 # v5
      - uses: pnpm/action-setup@v4 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - uses: actions/cache@v4 # v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('server/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - name: Java 组合前提与 Maven 测试
        run: node scripts/ci-stage.mjs linux-server

  brand-gate:
    name: 品牌中立门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22.19.0
      - name: 词表与全树扫描
        run: node scripts/ci-stage.mjs brand

  package-smoke:
    name: Windows 打包冒烟
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5 # v5
      - uses: pnpm/action-setup@v4 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/cache@v4 # v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-cache-${{ runner.os }}-v1
          restore-keys: |
            electron-cache-${{ runner.os }}-
      - uses: actions/cache@v4 # v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}-v1
          restore-keys: |
            electron-builder-cache-${{ runner.os }}-
      - name: Windows 构建、dir 打包与冒烟
        run: node scripts/ci-stage.mjs windows-package

  deployment-smoke:
    name: Linux 新镜像与局部 CA 部署冒烟
    runs-on: ubuntu-latest
    needs: [test, server-test, brand-gate]
    steps:
      - uses: actions/checkout@v5 # v5
      - uses: actions/setup-node@v4 # v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-java@v4 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: 新镜像、HTTP、私有 CA 与协作冒烟
        run: node scripts/ci-stage.mjs deployment
      - name: 归档部署冒烟身份与生命周期
        if: always()
        uses: actions/upload-artifact@v4 # v4
        with:
          name: runner-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            local/f7b-t11/apicc-runner-smoke-*.json
            local/f7f-acceptance/containers-*/containers.json
          if-no-files-found: warn
